<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooper Teaches Tennis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-center">
    <div class="container" style="width:100%;max-width:420px;">

      <div class="brand-block">
        <div class="brand-block__logo">🎾</div>
        <div class="brand-block__name">Cooper Teaches Tennis</div>
        <div class="brand-block__tagline">Access your player profile &amp; session notes</div>
      </div>

      <!-- State 1: Email lookup form -->
      <div id="state-lookup">
        <div class="card">
          <div id="lookup-error" class="alert alert-error" role="alert"></div>

          <div class="form-group">
            <label for="email-input">Your email address</label>
            <input
              type="email"
              id="email-input"
              placeholder="you@example.com"
              autocomplete="email"
              autocapitalize="none"
            >
          </div>

          <button class="btn btn--primary mt-16" id="lookup-btn" type="button">
            Access My Profile
          </button>
        </div>

        <div class="text-center mt-16" style="display:flex;justify-content:center;gap:8px;">
          <a href="guest.html" class="btn btn--ghost">Visit as guest</a>
          <span style="color:var(--color-border);line-height:2.2;">|</span>
          <a href="/api/auth/github" class="btn btn--ghost">Coach Login →</a>
        </div>
      </div>

      <!-- State 2: Email not found -->
      <div id="state-notfound" style="display:none;">
        <div class="card">
          <p style="margin-bottom:16px;font-size:0.9375rem;">
            We don't have a profile for that email yet.
          </p>
          <p class="text-muted" style="margin-bottom:20px;">
            If you're a Cooper Teaches Tennis student, you can create your player profile below.
          </p>
          <button class="btn btn--primary" id="create-profile-btn" type="button">
            Create My Profile
          </button>
          <button class="btn btn--secondary mt-16" id="try-again-btn" type="button">
            ← Try a different email
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/index-page.js"></script>
</body>
</html>
