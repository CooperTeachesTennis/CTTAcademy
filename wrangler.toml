name = "ctt-worker"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "CTT_KV"
id = "945aa45b37d94e22a71a5271a004b50c"
preview_id = "ddf7b4d41a964abc8995343066cec6a1"

# All secrets are set via the Cloudflare dashboard or wrangler secret put — never put values here
# Required secrets:
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put OWNER_GITHUB_ID    (numeric GitHub user ID — not the username)
