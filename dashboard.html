<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Cooper Teaches Tennis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav-bar">
    <a href="dashboard.html" class="nav-logo">Cooper Teaches Tennis</a>
    <div class="nav-actions">
      <button class="btn btn--ghost" id="logout-btn" type="button" style="color:var(--color-accent);">
        Sign out
      </button>
    </div>
  </nav>

  <div class="container--wide mt-24" style="padding:24px 16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
      <h1 style="font-size:1.375rem;font-weight:700;color:var(--color-primary-dark);">Your Players</h1>
      <a href="player.html?new=true" class="btn btn--primary btn--sm">+ Add player</a>
    </div>

    <div class="search-bar">
      <span class="search-bar__icon" aria-hidden="true">🔍</span>
      <input
        type="text"
        id="search-input"
        placeholder="Search players by name…"
        autocomplete="off"
      >
    </div>

    <div id="players-container">
      <div class="spinner"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
